name: mirror

# Automated public-mirror sync (#195): every push to main (and every tag)
# lands on github.com/julioarguello/serverstartup-io. Replaces the manual
# scripts/sync-public.sh run, which stays as the fallback.
#
# This file travels WITH the mirror, so the job hard-gates on the source
# repository — on the mirror it is inert by construction.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'julioarguello/www-serverstartup-io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate on MIRROR_SSH_KEY
        id: gate
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          if [ -z "$MIRROR_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MIRROR_SSH_KEY secret not set — mirror sync skipped"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          fetch-depth: 0 # the mirror needs the full history of main

      - name: Push main + tags to the public mirror
        if: steps.gate.outputs.ready == 'true'
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_URL: git@github.com:julioarguello/serverstartup-io.git
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"

          # A tag push checks the runner out in DETACHED HEAD: there is no
          # local `main`, so `git push … main --tags` died with "src refspec
          # main does not match any" on every single tag (#313 — v0.9.38,
          # v0.9.39 and v0.9.40 all failed this way). Pushing the
          # remote-tracking ref instead works for BOTH event types, so the
          # command stays single and neither branch of the trigger is special.
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          # …and the tags as the SOURCE holds them. On a tag event the runner
          # receives the event's own tag PEELED — refs/tags/vX points at the
          # commit, not at the annotated tag object — so pushing it wrote a
          # lightweight tag onto the mirror and created the divergence that
          # then blocked every later push (#313). Re-fetching with force
          # replaces the peeled ref with the real object before it travels.
          git fetch --quiet --force origin "+refs/tags/*:refs/tags/*"
          #
          # Tags are FORCED (`+`). Measured on the real repos: the mirror held
          # v0.9.41 as a lightweight tag pointing at the commit while the source
          # held it as an annotated tag object. Divergent refs like that make
          # every later non-forced push fail with "(already exists)" — for good,
          # since nothing ever repairs them. Forcing is right here by definition:
          # this job's whole purpose is to make the mirror match the source.
          # `main` stays UNFORCED, so a genuine divergence there fails loudly
          # instead of being silently overwritten.
          git push "$MIRROR_URL" \
            "refs/remotes/origin/main:refs/heads/main" \
            "+refs/tags/*:refs/tags/*"

          # report what was pushed, not that something was
          echo "mirror synced → julioarguello/serverstartup-io"
          echo "  main: $(git rev-parse --short refs/remotes/origin/main)"
          echo "  tags: $(git tag --list | wc -l | tr -d ' ')"
