name: deploy-preview

# Every merge to main lands on the live preview URL automatically (#193).
# Runs only after the quality-gates workflow succeeds on main (workflow_run
# fires from the default branch), or by hand via workflow_dispatch.
#
# Until the CLOUDFLARE_API_TOKEN repo secret exists, the deploy job skips
# with a notice instead of failing — the workflow can land inert and
# activates the moment the secret is added.
on:
  workflow_run:
    workflows: [quality-gates]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-preview
  cancel-in-progress: false # never kill a deploy mid-flight (mixed-state rule)

env:
  PREVIEW_URL: https://www-serverstartup-io-preview.serverstartup-s-partner-demo-account3612.workers.dev

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ env.PREVIEW_URL }}
    outputs:
      deployed: ${{ steps.gate.outputs.deployed }}
      preview_url: ${{ env.PREVIEW_URL }}
    steps:
      - name: Gate on CLOUDFLARE_API_TOKEN
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — preview deploy skipped"
          else
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.deployed == 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.deployed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.gate.outputs.deployed == 'true'
        run: npm ci

      - name: Build (preview environment)
        if: steps.gate.outputs.deployed == 'true'
        # The Cloudflare adapter flattens the wrangler env at BUILD time —
        # wrangler deploy --env is a no-op against the generated config.
        run: CLOUDFLARE_ENV=preview npx astro build

      # The worker deploys BEFORE the D1 refresh, not after. EmDash applies
      # its D1 migrations lazily in the request path (guarded by
      # _emdash_migrations_lock), so on a schema-bumping release only the NEW
      # worker can bring the remote schema forward — and the refresh writes
      # rows in the new shape. Measured 2026-08-22 (EmDash 0.6→0.34):
      # refresh-first died with "_emdash_collections has 17 columns but 23
      # values were supplied". The seconds of new-worker/old-content between
      # these steps are a pre-launch preview trade-off, taken knowingly.
      - name: Deploy preview worker
        if: steps.gate.outputs.deployed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d70cd71aecc76f94c73d7a6f3cc1265d
          command: deploy

      - name: Build local canonical D1 (defines the migration target)
        if: steps.gate.outputs.deployed == 'true'
        id: canonical
        # ci-local-stack seeds a fresh local sqlite the canonical way (emdash
        # applies its migrations). Its _emdash_migrations count IS the target
        # the remote must reach — derived, never hardcoded.
        run: |
          scripts/ci-local-stack.sh 8787
          lsof -ti :8787 | xargs kill -9 2>/dev/null || true
          D1_DB=$(find .wrangler -name "*.sqlite" -path "*/d1/*" -not -name "metadata.sqlite" | head -1)
          TARGET=$(sqlite3 "$D1_DB" "SELECT count(*) FROM _emdash_migrations;")
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "local canonical DB has $TARGET applied migrations"

      - name: Wait until the worker migrates the remote D1
        if: steps.gate.outputs.deployed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d70cd71aecc76f94c73d7a6f3cc1265d
        # The worker applies migrations inside getDatabase() under a lock when
        # the EmDash runtime initializes — anonymous page requests can take a
        # cached-binding shortcut, so we poke /_emdash/admin (guaranteed
        # runtime init) and poll the REAL condition: the remote
        # _emdash_migrations count reaching the local canonical target.
        # The first version of this step gated on HTTP 200 of "/" — a proxy
        # that passed while the schema stayed old (run 32586774068).
        run: |
          TARGET=${{ steps.canonical.outputs.target }}
          for i in $(seq 1 36); do
            curl -s -o /dev/null -m 15 "$PREVIEW_URL/_emdash/admin" || true
            COUNT=$(npx wrangler d1 execute www-serverstartup-io-preview --remote --json \
              --command "SELECT count(*) AS c FROM _emdash_migrations;" 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s)[0].results[0].c)}catch{console.log(-1)}})")
            echo "attempt $i: remote applied=$COUNT target=$TARGET (poked /_emdash/admin from the GitHub runner; count via wrangler d1 API)"
            if [ "$COUNT" -ge "$TARGET" ] 2>/dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::remote D1 never reached $TARGET applied migrations — the worker is not migrating; refusing to refresh content onto a stale schema"
          exit 1

      - name: Refresh preview D1 from seed/seed.json
        if: steps.gate.outputs.deployed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d70cd71aecc76f94c73d7a6f3cc1265d
        # seed-remote-preview reproduces the canonical local content remotely
        # after rehearsing the generated SQL on a throwaway database. The
        # local stack was already built by the canonical step above.
        run: |
          scripts/seed-remote-preview.sh www-serverstartup-io-preview

      - name: Summary
        if: always()
        run: |
          {
            echo "## deploy-preview"
            if [ "${{ steps.gate.outputs.deployed }}" = "true" ]; then
              echo "Deployed **main** to the preview environment:"
              echo ""
              echo "🔍 ${{ env.PREVIEW_URL }}"
            else
              echo "Skipped — CLOUDFLARE_API_TOKEN secret not set."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/verify-deploy.yml
    with:
      base_url: ${{ needs.deploy.outputs.preview_url }}
